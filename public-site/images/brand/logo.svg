<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e5c56"/>
      <stop offset="100%" stop-color="#7a9084"/>
    </linearGradient>
  </defs>
  <!-- Logo mark -->
  <rect x="0" y="10" width="40" height="40" rx="2" fill="url(#mark)"/>
  <text x="20" y="36" font-family="Georgia, serif" font-size="22" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="300">+</text>
  <!-- Brand name -->
  <text x="52" y="30" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2421" font-weight="400">Organization</text>
  <text x="52" y="48" font-family="Georgia, serif" font-size="11" fill="#7a9084" letter-spacing="2">CARE</text>
</svg>
