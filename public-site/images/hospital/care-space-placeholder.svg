<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f8f6"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ede8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <!-- Window -->
  <rect x="180" y="60" width="360" height="480" fill="#e8f0ed" opacity="0.7"/>
  <rect x="180" y="60" width="360" height="4" fill="#c5a059" opacity="0.35"/>
  <rect x="180" y="60" width="4" height="480" fill="#c5a059" opacity="0.2"/>
  <rect x="536" y="60" width="4" height="480" fill="#c5a059" opacity="0.2"/>
  <rect x="358" y="60" width="4" height="480" fill="#ddd9d2"/>
  <rect x="180" y="296" width="360" height="4" fill="#ddd9d2"/>
  <!-- Curtain -->
  <rect x="536" y="60" width="100" height="480" fill="#ddcab6" opacity="0.35"/>
  <!-- Bed frame -->
  <rect x="80" y="600" width="740" height="400" rx="4" fill="url(#bed)"/>
  <rect x="80" y="600" width="740" height="6" fill="#e8ece9"/>
  <rect x="80" y="600" width="740" height="2" fill="#c5a059" opacity="0.25"/>
  <!-- Pillow -->
  <rect x="140" y="620" width="280" height="160" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="140" y="620" width="280" height="3" fill="#e8ece9"/>
  <!-- Blanket -->
  <rect x="80" y="780" width="740" height="200" rx="4" fill="#dde4e0"/>
  <rect x="80" y="780" width="740" height="30" fill="#e8ece9" opacity="0.8"/>
  <rect x="80" y="808" width="740" height="2" fill="#c5a059" opacity="0.2"/>
  <!-- Bed side table -->
  <rect x="740" y="680" width="120" height="280" fill="#e8ece9"/>
  <rect x="740" y="680" width="120" height="4" fill="#c5a059" opacity="0.3"/>
  <!-- Small item on table -->
  <rect x="770" y="640" width="60" height="40" rx="2" fill="#f9f8f6"/>
  <!-- Plant on table -->
  <ellipse cx="800" cy="655" rx="18" ry="22" fill="#7a9084" opacity="0.5"/>
  <rect x="795" y="677" width="10" height="20" fill="#ddcab6" opacity="0.7"/>
  <!-- Floor -->
  <rect x="0" y="1000" width="900" height="200" fill="#f1efeb"/>
  <rect x="0" y="1000" width="900" height="1" fill="#e8ece9"/>
  <!-- Label -->
  <text x="60" y="1155" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3e5c56" opacity="0.65">Patient Care Space</text>
  <text x="840" y="1155" font-family="Georgia, serif" font-size="14" fill="#7a9084" opacity="0.45" text-anchor="end">Placeholder</text>
</svg>
