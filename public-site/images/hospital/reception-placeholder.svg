<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f8f6"/>
      <stop offset="100%" stop-color="#f1efeb"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ece9"/>
      <stop offset="100%" stop-color="#d0d8d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <!-- Back wall panels -->
  <rect x="0" y="0" width="1200" height="560" fill="#f3f2ef"/>
  <rect x="80" y="60" width="2" height="500" fill="#e8ece9"/>
  <rect x="300" y="60" width="2" height="500" fill="#e8ece9"/>
  <rect x="520" y="60" width="2" height="500" fill="#e8ece9"/>
  <rect x="740" y="60" width="2" height="500" fill="#e8ece9"/>
  <rect x="960" y="60" width="2" height="500" fill="#e8ece9"/>
  <rect x="1120" y="60" width="2" height="500" fill="#e8ece9"/>
  <!-- Ceiling line -->
  <rect x="0" y="60" width="1200" height="2" fill="#c5a059" opacity="0.35"/>
  <!-- Reception desk -->
  <rect x="300" y="420" width="700" height="220" fill="url(#desk)"/>
  <rect x="300" y="420" width="700" height="8" fill="#7a9084" opacity="0.4"/>
  <rect x="300" y="420" width="700" height="1" fill="#c5a059" opacity="0.5"/>
  <!-- Desk front panel -->
  <rect x="310" y="428" width="680" height="200" fill="#dde4e0"/>
  <!-- Desk accents -->
  <rect x="310" y="500" width="680" height="1" fill="#c5a059" opacity="0.3"/>
  <!-- Monitor suggestion -->
  <rect x="700" y="330" width="140" height="90" rx="2" fill="#3e5c56" opacity="0.15"/>
  <rect x="700" y="418" width="140" height="4" fill="#3e5c56" opacity="0.1"/>
  <!-- Plant -->
  <ellipse cx="180" cy="480" rx="40" ry="50" fill="#7a9084" opacity="0.5"/>
  <ellipse cx="180" cy="450" rx="30" ry="40" fill="#3e5c56" opacity="0.4"/>
  <rect x="170" y="530" width="20" height="50" fill="#ddcab6" opacity="0.6"/>
  <!-- Signage on wall -->
  <rect x="440" y="180" width="320" height="80" rx="2" fill="rgba(62,92,86,0.08)"/>
  <rect x="440" y="180" width="320" height="1" fill="#c5a059" opacity="0.35"/>
  <text x="600" y="225" font-family="Georgia, serif" font-size="20" fill="#3e5c56" opacity="0.6" text-anchor="middle">Reception</text>
  <!-- Floor -->
  <rect x="0" y="640" width="1200" height="260" fill="#f9f8f6"/>
  <rect x="0" y="640" width="1200" height="1" fill="#e8ece9"/>
  <!-- Label -->
  <rect x="0" y="840" width="1200" height="60" fill="rgba(249,248,246,0.9)"/>
  <rect x="0" y="840" width="1200" height="1" fill="#e8ece9"/>
  <text x="60" y="878" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3e5c56" opacity="0.7">Reception Area</text>
  <text x="1140" y="878" font-family="Georgia, serif" font-size="14" fill="#7a9084" opacity="0.45" text-anchor="end">Placeholder Image</text>
</svg>
