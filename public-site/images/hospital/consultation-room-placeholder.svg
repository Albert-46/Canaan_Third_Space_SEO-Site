<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f2ef"/>
      <stop offset="100%" stop-color="#eceae5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Dividing wall -->
  <rect x="0" y="0" width="480" height="700" fill="#f9f8f6"/>
  <rect x="480" y="0" width="2" height="700" fill="#e0ddd8"/>
  <!-- Window light -->
  <rect x="80" y="60" width="260" height="380" fill="#e8ece9" opacity="0.6"/>
  <rect x="80" y="60" width="260" height="4" fill="#c5a059" opacity="0.3"/>
  <rect x="80" y="60" width="2" height="380" fill="#c5a059" opacity="0.2"/>
  <rect x="338" y="60" width="2" height="380" fill="#c5a059" opacity="0.2"/>
  <!-- Window cross -->
  <rect x="80" y="245" width="260" height="2" fill="#ddd9d2"/>
  <rect x="210" y="60" width="2" height="380" fill="#ddd9d2"/>
  <!-- Doctor chair -->
  <ellipse cx="780" cy="420" rx="80" ry="20" fill="#3e5c56" opacity="0.15"/>
  <rect x="730" y="250" width="100" height="180" rx="8" fill="#3e5c56" opacity="0.2"/>
  <rect x="720" y="390" width="120" height="15" rx="4" fill="#3e5c56" opacity="0.15"/>
  <!-- Desk -->
  <rect x="550" y="400" width="560" height="12" fill="#d4cfc8"/>
  <rect x="550" y="412" width="560" height="200" fill="#ddd9d2"/>
  <!-- Patient chair -->
  <rect x="200" y="450" width="160" height="120" rx="6" fill="#ddcab6" opacity="0.5"/>
  <rect x="190" y="440" width="180" height="15" rx="4" fill="#ddcab6" opacity="0.4"/>
  <!-- Small decorative plant -->
  <ellipse cx="1100" cy="390" rx="30" ry="35" fill="#7a9084" opacity="0.45"/>
  <rect x="1094" y="425" width="12" height="30" fill="#ddcab6" opacity="0.6"/>
  <!-- Clipboard on desk -->
  <rect x="630" y="360" width="80" height="42" rx="2" fill="#f9f8f6" opacity="0.9"/>
  <rect x="630" y="360" width="80" height="3" fill="#c5a059" opacity="0.4"/>
  <!-- Label -->
  <rect x="0" y="730" width="1200" height="70" fill="rgba(243,242,239,0.95)"/>
  <rect x="0" y="730" width="1200" height="1" fill="#e0ddd8"/>
  <text x="60" y="772" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3e5c56" opacity="0.7">Consultation Room</text>
  <text x="1140" y="772" font-family="Georgia, serif" font-size="14" fill="#7a9084" opacity="0.45" text-anchor="end">Placeholder Image</text>
</svg>
