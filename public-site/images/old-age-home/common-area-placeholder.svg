<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f8f6"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <!-- Large windows with garden view -->
  <rect x="0" y="60" width="500" height="620" fill="#e8f2ed" opacity="0.5"/>
  <rect x="0" y="60" width="500" height="4" fill="#c5a059" opacity="0.3"/>
  <rect x="500" y="60" width="4" height="620" fill="#c5a059" opacity="0.2"/>
  <!-- Garden suggestion -->
  <ellipse cx="140" cy="420" rx="80" ry="90" fill="#7a9084" opacity="0.3"/>
  <ellipse cx="300" cy="480" rx="60" ry="70" fill="#5c7a6a" opacity="0.25"/>
  <ellipse cx="420" cy="380" rx="50" ry="65" fill="#7a9084" opacity="0.2"/>
  <!-- Ceiling beam -->
  <rect x="0" y="60" width="1200" height="4" fill="#ddcab6" opacity="0.5"/>
  <!-- Sofa group -->
  <rect x="580" y="480" width="560" height="200" rx="8" fill="#ddcab6" opacity="0.65"/>
  <rect x="580" y="480" width="560" height="30" rx="8" fill="#ddd9d2" opacity="0.5"/>
  <rect x="600" y="450" width="240" height="35" rx="4" fill="#ddcab6" opacity="0.7"/>
  <rect x="880" y="450" width="240" height="35" rx="4" fill="#ddcab6" opacity="0.7"/>
  <!-- Coffee table -->
  <rect x="700" y="680" width="260" height="80" rx="3" fill="#c5a059" opacity="0.2"/>
  <rect x="700" y="680" width="260" height="3" fill="#c5a059" opacity="0.3"/>
  <!-- Armchair -->
  <rect x="560" y="540" width="180" height="140" rx="6" fill="#e8ece9" opacity="0.8"/>
  <rect x="550" y="530" width="200" height="18" rx="4" fill="#ddd9d2" opacity="0.8"/>
  <!-- Plant corner -->
  <ellipse cx="1140" cy="420" rx="50" ry="60" fill="#7a9084" opacity="0.45"/>
  <rect x="1133" y="480" width="14" height="50" fill="#ddcab6" opacity="0.7"/>
  <!-- Rug -->
  <ellipse cx="860" cy="730" rx="200" ry="50" fill="#c5a059" opacity="0.12"/>
  <ellipse cx="860" cy="730" rx="180" ry="44" fill="transparent" stroke="#c5a059" stroke-width="2" opacity="0.2"/>
  <!-- Label -->
  <rect x="0" y="820" width="1200" height="80" fill="rgba(249,248,246,0.92)"/>
  <rect x="0" y="820" width="1200" height="1" fill="#e8ece9"/>
  <text x="60" y="862" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3e5c56" opacity="0.7">Common Lounge Area</text>
  <text x="1140" y="862" font-family="Georgia, serif" font-size="14" fill="#7a9084" opacity="0.45" text-anchor="end">Placeholder Image</text>
</svg>
