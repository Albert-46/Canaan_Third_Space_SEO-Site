<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f8f6"/>
      <stop offset="100%" stop-color="#f1efeb"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3f0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <!-- Window -->
  <rect x="100" y="60" width="280" height="340" fill="#e8f0ed" opacity="0.55"/>
  <rect x="100" y="60" width="280" height="4" fill="#c5a059" opacity="0.3"/>
  <rect x="100" y="60" width="4" height="340" fill="#c5a059" opacity="0.2"/>
  <rect x="376" y="60" width="4" height="340" fill="#c5a059" opacity="0.2"/>
  <rect x="238" y="60" width="4" height="340" fill="#ddd9d2"/>
  <rect x="100" y="226" width="280" height="4" fill="#ddd9d2"/>
  <!-- Curtain panel -->
  <rect x="376" y="60" width="80" height="340" fill="#ddcab6" opacity="0.3"/>
  <!-- Bed frame -->
  <rect x="60" y="480" width="720" height="340" rx="5" fill="url(#bed)"/>
  <rect x="60" y="480" width="720" height="6" fill="#e8ece9"/>
  <rect x="60" y="480" width="720" height="2" fill="#c5a059" opacity="0.2"/>
  <!-- Headboard -->
  <rect x="60" y="390" width="720" height="100" rx="4" fill="#ddd9d2"/>
  <rect x="60" y="390" width="720" height="4" fill="#c5a059" opacity="0.25"/>
  <!-- Pillows -->
  <rect x="100" y="498" width="220" height="130" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="100" y="498" width="220" height="4" fill="#e8ece9"/>
  <rect x="340" y="498" width="220" height="130" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="340" y="498" width="220" height="4" fill="#e8ece9"/>
  <!-- Blanket -->
  <rect x="60" y="628" width="720" height="180" rx="5" fill="#dde4e0"/>
  <rect x="60" y="628" width="720" height="22" fill="#e8ece9" opacity="0.7"/>
  <rect x="60" y="648" width="720" height="1.5" fill="#c5a059" opacity="0.2"/>
  <!-- Bedside table -->
  <rect x="730" y="540" width="120" height="260" fill="#ede8e0"/>
  <rect x="730" y="540" width="120" height="3" fill="#c5a059" opacity="0.3"/>
  <!-- Lamp on table -->
  <rect x="777" y="480" width="26" height="60" fill="#ddd9d2"/>
  <ellipse cx="790" cy="470" rx="36" ry="22" fill="#c5a059" opacity="0.25"/>
  <rect x="782" y="491" width="16" height="8" fill="#ddcab6" opacity="0.5"/>
  <!-- Plant on table -->
  <ellipse cx="753" cy="525" rx="14" ry="18" fill="#7a9084" opacity="0.5"/>
  <rect x="748" y="543" width="10" height="16" fill="#ddcab6" opacity="0.7"/>
  <!-- Label -->
  <rect x="0" y="830" width="900" height="70" fill="rgba(249,248,246,0.92)"/>
  <rect x="0" y="830" width="900" height="1" fill="#e8ece9"/>
  <text x="50" y="872" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3e5c56" opacity="0.7">Comfortable Bedroom</text>
  <text x="850" y="872" font-family="Georgia, serif" font-size="14" fill="#7a9084" opacity="0.45" text-anchor="end">Placeholder</text>
</svg>
